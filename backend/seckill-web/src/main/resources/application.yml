server:
  port: 8081
  shutdown: graceful

spring:
  application:
    name: linjian-seckill

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/seckill?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    # 仓库是公开的，口令一律走环境变量；默认值仅用于本地开发，不是生产配置
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456789}
    hikari:
      # 秒杀场景下连接池不宜过大：单机 MySQL 的瓶颈通常在 IO 而非连接数
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000

  data:
    redis:
      # 走环境变量是为了容器化：docker compose 里 Redis 服务名是 redis、
      # 端口映射到 6380，硬编码 localhost:6379 会让后端连回宿主机原生实例，
      # 表现为「容器都起来了但数据写进了另一套 Redis」
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # db0 存放登录态与通用缓存；库存相关键在 W3 迁往 db1（见技术方案第 8 节）
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 50
          max-idle: 10
          min-idle: 2

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    # 开启 publisher confirm：投递结果通过异步回调回写本地消息表，
    # 失败的消息由定时任务重投（at-least-once）
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        # 手动 ack：自动 ack 在方法抛异常时消息已被确认，等于丢消息
        acknowledge-mode: manual
        # 每个消费者预取 20 条。设太大会让消息在单个消费者排队，
        # 关单与其它消费者抢不到；设太小则吞吐上不去
        prefetch: 20
        concurrency: 2
        max-concurrency: 8
        # 重试策略交给 OrderConsumer 自己判断（首次 requeue、第二次进死信），
        # 不用 Spring 的自动重试，否则两层重试叠加会导致重试次数不可控
        default-requeue-rejected: false
        retry:
          enabled: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 开发期打印 SQL；压测前必须关闭，否则标准输出会成为瓶颈
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置
jwt:
  # 密钥长度必须 >= 32 字节，否则 HMAC-SHA256 初始化失败；
  # 公开仓库中不得出现真实生产密钥，部署时用环境变量 JWT_SECRET 覆盖
  secret: ${JWT_SECRET:linjian-seckill-jwt-secret-key-please-change-in-production-2026}
  access-token-expiration: 7200000      # 2 小时
  refresh-token-expiration: 604800000   # 7 天
  token-prefix: "Bearer "
  header: Authorization
  issuer: linjian-seckill

# 初始管理员（仅本地开发使用；首次启动时若库中无管理员则自动创建）
seckill:
  init-admin:
    username: ${INIT_ADMIN_USERNAME:admin}
    # 与 sql/seed-dev.sql 里的演示账号保持一致：两处不一致时，走 seed 初始化的库
    # 是 123456、走 AdminInitializer 首次创建的是这里的值，同一个项目两套口令极容易踩坑。
    # 生产部署必须用 INIT_ADMIN_PASSWORD 覆盖。
    password: ${INIT_ADMIN_PASSWORD:123456}

  redis:
    # 库存专用库号。与登录态所在的 db0 隔离，
    # 这样清理/对账时 FLUSHDB 不会误伤 refreshToken
    stock-database: 1

  preheat:
    # 提前多少分钟把库存加载进 Redis
    lead-minutes: 5
    # 扫描间隔（毫秒）；压测时可调大，避免定时任务与业务抢 CPU
    scan-interval-ms: 30000

  order:
    # 待支付订单的有效期；超过即关单并回补库存
    timeout-minutes: 15
    # 关单扫描间隔
    timeout-scan-interval-ms: 30000

  local-message:
    # 本地消息表重投间隔
    retry-interval-ms: 15000

  reconcile:
    # 库存对账间隔。对账会遍历进行中的活动，频率不宜过高
    interval-ms: 300000

# 接口文档：http://localhost:8081/doc.html
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    root: info
    com.linjian.seckill: debug
