# ============================================================
# 林间秒杀 · Nginx 配置
#
# 职责：
#   1. 托管两个前端的构建产物（user 在 /user/、admin 在 /admin/）
#   2. 把 /api 反向代理到后端 seckill-web:8081
#   3. history 路由回退到各自 index.html（避免刷新 404）
# ============================================================

server {
    listen 80;
    server_name _;

    # 根路径给个入口，方便直接访问两个前端
    location = / {
        return 302 /user/;
    }

    # ---- 用户端 ----
    location /user/ {
        alias /usr/share/nginx/html/user/;
        try_files $uri $uri/ /user/index.html;
    }

    # ---- 管理端 ----
    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    # ---- 后端 API 反向代理 ----
    # 两个前端都用相对路径 /api 请求，这里统一转发到后端容器。
    # 秒杀接口有长轮询（轮询结果），超时不能太短。
    location /api/ {
        proxy_pass http://seckill-web:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # ---- 静态资源缓存 ----
    # Vite 产物带 content hash，可以长缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;
}
