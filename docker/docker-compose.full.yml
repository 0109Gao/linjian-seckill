# ============================================================
# 林间秒杀 · 完整编排（上线级交付形态）
#
# 一条命令拉起全栈：
#   docker compose -f docker/docker-compose.full.yml up -d --build
#
# 服务：
#   mysql(3306) / redis(6379) / rabbitmq(5672+15672) —— 默认端口，交付态
#   seckill-web(8081) —— 后端，连容器内中间件（服务名直连，非 localhost）
#   nginx(80) —— 托管 user(/user/) 与 admin(/admin/) 两个前端 + 反代 /api
#
# 与 docker-compose.middleware.yml 的关系：
#   那是 W4 双轨开发态（备用端口 3307/6380/5673，与宿主机原生中间件并行）。
#   本文件是 W5 交付态，端口回归默认，中间件只存在于容器内，后端用服务名直连。
# ============================================================

name: linjian-seckill

services:
  mysql:
    image: mysql:8.4
    container_name: sk-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "123456789"
      MYSQL_DATABASE: seckill
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-time-zone=+08:00
      - --max-connections=500
      - --slow-query-log=1
      - --long-query-time=1
    volumes:
      - sk-mysql-data:/var/lib/mysql
      - ../sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../sql/seed-dev.sql:/docker-entrypoint-initdb.d/02-seed-dev.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p123456789"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: sk-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - sk-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    container_name: sk-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: seckill
      RABBITMQ_DEFAULT_PASS: seckill123
      TZ: Asia/Shanghai
    volumes:
      - sk-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 40s

  seckill-web:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: linjian-seckill-web:1.0.0
    container_name: sk-web
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      # 容器内直连中间件：用服务名，端口是容器内默认端口
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: "123456789"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: seckill
      RABBITMQ_PASSWORD: seckill123
      TZ: Asia/Shanghai
      # 生产部署必须覆盖这两个（这里是演示默认值）
      JWT_SECRET: ${JWT_SECRET:-linjian-seckill-jwt-secret-key-please-change-in-production-2026}
      INIT_ADMIN_PASSWORD: ${INIT_ADMIN_PASSWORD:-123456}
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8081/api/activities"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  nginx:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    image: linjian-seckill-frontend:1.0.0
    container_name: sk-nginx
    restart: unless-stopped
    depends_on:
      - seckill-web
    ports:
      - "80:80"

volumes:
  sk-mysql-data:
    name: sk-mysql-data
  sk-redis-data:
    name: sk-redis-data
  sk-rabbitmq-data:
    name: sk-rabbitmq-data
