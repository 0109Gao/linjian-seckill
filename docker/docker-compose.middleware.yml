# ============================================================
# 林间秒杀 · 中间件双轨编排（开发态）
#
# 用途：与宿主机上已装的 MySQL/Redis/RabbitMQ「并行」跑一套，不抢默认端口，
#       因此可以随时起停、随时验证，而不打断本地联调。
#
#   宿主机原生（W4 联调用）        容器（本文件，W5 起逐步接管）
#   MySQL     3306                 3307
#   Redis     6379                 6380
#   RabbitMQ  5672 / 15672         5673 / 15673
#
# 启动：  docker compose -f docker/docker-compose.middleware.yml up -d
# 查看：  docker compose -f docker/docker-compose.middleware.yml ps
# 停止：  docker compose -f docker/docker-compose.middleware.yml down
# 清库：  docker compose -f docker/docker-compose.middleware.yml down -v
#
# 后端连容器需要覆盖四个环境变量（见文件末尾注释）：
#   MYSQL_PORT=3307  REDIS_PORT=6380
#   RABBITMQ_PORT=5673  RABBITMQ_USERNAME=seckill  RABBITMQ_PASSWORD=seckill123
# ============================================================

name: linjian-seckill-dev

services:
  mysql:
    image: mysql:8.4
    container_name: sk-mysql-dev
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "123456789"
      MYSQL_DATABASE: seckill
      TZ: Asia/Shanghai
    command:
      # 排序规则与 sql/schema.sql 头部保持一致：这套表用的是 utf8mb4_general_ci，
      # 若容器默认成 0900_ai_ci，JOIN 时会出现「Illegal mix of collations」
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-time-zone=+08:00
      # 秒杀压测时连接数会明显高于常规业务
      - --max-connections=500
      - --slow-query-log=1
      - --long-query-time=1
    volumes:
      - sk-mysql-data:/var/lib/mysql
      # 只在数据卷为空（首次启动）时执行，按文件名顺序：
      # 01 建库建表 → 02 演示数据（含 admin / buyer01 两个账号，密码 123456）
      - ../sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../sql/seed-dev.sql:/docker-entrypoint-initdb.d/02-seed-dev.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p123456789"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: sk-redis-dev
    restart: unless-stopped
    ports:
      - "6380:6379"
    # 不开 requirepass：与宿主机原生 Redis 保持一致，避免本地切来切去时
    # 还要改 application.yml。生产环境必须加密码。
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - sk-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    container_name: sk-rabbitmq-dev
    restart: unless-stopped
    ports:
      - "5673:5672"
      - "15673:15672"
    environment:
      # 关键：不要用 guest。RabbitMQ 的 guest 账号被限制为「仅 localhost 可连」，
      # 宿主机上的后端连 5673 会被拒（ACCESS_REFUSED），且报错信息不提 loopback 限制，
      # 排查起来很费时间。这里直接建一个专用账号。
      RABBITMQ_DEFAULT_USER: seckill
      RABBITMQ_DEFAULT_PASS: seckill123
      TZ: Asia/Shanghai
    volumes:
      - sk-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 40s

volumes:
  sk-mysql-data:
    name: sk-mysql-data
  sk-redis-data:
    name: sk-redis-data
  sk-rabbitmq-data:
    name: sk-rabbitmq-data
