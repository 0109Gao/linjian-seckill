# ============================================================
# 林间秒杀 · 后端 CI
# 触发：push 到 main / 对 backend 相关改动的 PR
# 内容：编译 + 单元测试 + 打包（不发布）
# ============================================================

name: backend-ci

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'sql/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'

jobs:
  build:
    name: Build & Test (JDK 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 单元测试全用 Mockito mock，不依赖 MySQL/Redis/RabbitMQ 实例，
      # 因此这里不需要 service container。
      - name: Run tests
        run: mvn -B test

      - name: Package (skip tests, already run)
        run: mvn -B -DskipTests package

      # 上传 fat jar 作为构建产物，便于本地快速复现
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: seckill-web-jar
          path: backend/seckill-web/target/seckill-web.jar
          retention-days: 7
